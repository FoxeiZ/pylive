[project]
name = "pylive"
version = "0.1.0"
description = "Real-time audio streaming server with YouTube integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.3.0",
    "httpx>=0.28.1",
    "quart>=0.20.0",
    "yt-dlp>=2025.11.12",
    "yt-dlp-ejs>=0.3.1",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "pyright>=1.1.407",
    "ruff>=0.13.2",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", ".venv", "**/node_modules", "**/.*"]

reportUnusedImport = false
reportUnusedVariable = false
reportUnusedFunction = false

reportMissingParameterType = "information"
reportUnknownParameterType = "information"
reportUnknownVariableType  = "information"
reportUnknownArgumentType  = "information"
reportUnknownMemberType    = "warning"
reportMissingTypeStubs     = false
reportPrivateUsage         = false
reportUninitializedInstanceVariable = "error"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = [
    # core
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort

    # strictness
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python)
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie (misc lints)
    "RUF",    # ruff-specific rules

    # async
    "ASYNC",  # async/await issues

    # security
    "S",      # flake8-bandit (security)

    # code quality
    "N",      # pep8-naming
    "ANN",    # flake8-annotations (type hints)
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint rules
    "PERF",   # perflint (performance)
    "FURB",   # refurb (modern Python)

    # type checking
    "TCH",    # flake8-type-checking (TYPE_CHECKING blocks)
    "FA",     # flake8-future-annotations
]

ignore = [
    "ANN002",  # missing type annotation for *args
    "ANN003",  # missing type annotation for **kwargs
    "ANN101",  # missing type for self
    "ANN102",  # missing type for cls
    "ANN401",  # dynamically typed expressions (Any)
    "ANN201",  # missing return type for public function
    "ANN202",  # missing return type for private function
    "ANN204",  # missing return type for __init__
    "S101",    # use of assert
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLW0603", # global statement
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"__init__.py" = ["F401"]
"scripts/*" = ["T20"]
